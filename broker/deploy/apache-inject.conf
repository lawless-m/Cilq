# Auto-inject the broker worker into pages via mod_substitute.
# Every HTML page Apache serves (or proxies) becomes a broker worker with no
# per-page edits. The worker script is served by the broker at /bridge/client.js
# (see apache-bridge.conf), so this is just a one-line injection.
#
# Enable the modules:
#   a2enmod substitute filter
#   systemctl reload apache2
#
# The injected tag references the broker's own copy of the client; its URL and
# token default to BRIDGE / this host (set in browser-bridge-client.js). To
# override per host, inject a small config script before it, e.g.:
#   <script>window.__BRIDGE_TOKEN='BRIDGE'</script>

# ── Case A: sites this Apache serves directly (DocumentRoot) ───────────────
# Put inside the <VirtualHost> for the site you want instrumented.

  AddOutputFilterByType SUBSTITUTE text/html
  Substitute "s|</head>|<script src=\"https://dw.ramsden-international.com/bridge/client.js\"></script></head>|in"


# ── Case B: proxied sites (extends the existing proxied.conf pattern) ───────
# Substitute can only rewrite UNCOMPRESSED HTML, so strip Accept-Encoding on
# the way to the upstream or the body arrives gzipped and the match fails.
#
#   RequestHeader unset Accept-Encoding
#   ProxyPass        / https://upstream.example.com/
#   ProxyPassReverse / https://upstream.example.com/
#   AddOutputFilterByType SUBSTITUTE text/html
#   Substitute "s|</head>|<script src=\"https://dw.ramsden-international.com/bridge/client.js\"></script></head>|in"

# ── Gotchas ────────────────────────────────────────────────────────────────
# • Substitute flags used: i = case-insensitive, n = plain string (no regex).
# • If a page has no </head>, fall back to injecting before </body>:
#     Substitute "s|</body>|<script src=\"https://dw.ramsden-international.com/bridge/client.js\"></script></body>|in"
# • Minified single-line HTML can exceed the per-line buffer; if injection
#   silently doesn't happen on large pages, raise it:
#     SubstituteMaxLineLength 10m
# • Don't instrument pages whose CSP blocks eval — the worker needs eval.
