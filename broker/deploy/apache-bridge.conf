# Reverse-proxy the broker at https://dw.ramsden-international.com/bridge/
#
# Enable the required modules first:
#   a2enmod proxy proxy_http proxy_wstunnel
#   systemctl reload apache2
#
# Drop this inside the <VirtualHost *:443> for dw.ramsden-international.com.
# The broker listens on 127.0.0.1:3141 and serves routes at the root
# (/jobs, /jobs/sync, /health, /ws); the /bridge/ prefix is stripped here.

# WebSocket endpoint MUST come first and use the ws:// scheme so the
# Upgrade handshake is tunnelled. (This is what the old proxied.conf lacked.)
ProxyPass        /bridge/ws  ws://127.0.0.1:3141/ws  retry=0
ProxyPassReverse /bridge/ws  ws://127.0.0.1:3141/ws

# Everything else (the HTTP job API) over plain http.
ProxyPass        /bridge/    http://127.0.0.1:3141/  retry=0
ProxyPassReverse /bridge/    http://127.0.0.1:3141/

# Clients then talk to, e.g.:
#   POST https://dw.ramsden-international.com/bridge/jobs/sync
#   GET  https://dw.ramsden-international.com/bridge/health
# Browsers connect to:
#   wss://dw.ramsden-international.com/bridge/ws?token=...&connectionId=...
